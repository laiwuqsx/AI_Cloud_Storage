server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/login {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10000;
        fastcgi_param SCRIPT_NAME /api/login;
    }

    location = /api/reg {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10001;
        fastcgi_param SCRIPT_NAME /api/reg;
    }

    location = /api/myfiles {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10002;
        fastcgi_param SCRIPT_NAME /api/myfiles;
    }

    location / {
        default_type application/json;
        return 404 '{"code":404,"msg":"route not found"}\n';
    }
}
