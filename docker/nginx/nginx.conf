server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/login {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10000;
        fastcgi_param SCRIPT_NAME /api/login;
    }

    location = /api/reg {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10001;
        fastcgi_param SCRIPT_NAME /api/reg;
    }

    location = /api/myfiles {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10002;
        fastcgi_param SCRIPT_NAME /api/myfiles;
    }

    location = /api/md5 {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10003;
        fastcgi_param SCRIPT_NAME /api/md5;
    }

    location = /api/dealfile {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10004;
        fastcgi_param SCRIPT_NAME /api/dealfile;
    }

    location = /api/logout {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10005;
        fastcgi_param SCRIPT_NAME /api/logout;
    }

    location = /api/upload {
        client_max_body_size 12m;
        fastcgi_request_buffering off;
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10006;
        fastcgi_param SCRIPT_NAME /api/upload;
    }

    location = /api/uploads/init {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10009;
        fastcgi_param SCRIPT_NAME /api/uploads/init;
    }

    location = /api/share {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10007;
        fastcgi_param SCRIPT_NAME /api/share;
    }

    location = /api/share/save {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10007;
        fastcgi_param SCRIPT_NAME /api/share/save;
    }

    location = /api/download {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10008;
        fastcgi_param SCRIPT_NAME /api/download;
    }

    location = /api/share/download {
        include fastcgi_params;
        fastcgi_pass fastcgi_app:10008;
        fastcgi_param SCRIPT_NAME /api/share/download;
    }

    location /_internal_storage/group1/M00/ {
        internal;
        alias /data/fastdfs/storage/data/;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
    }

    location /storage/ {
        default_type application/json;
        return 404 '{"code":404,"msg":"direct storage access disabled"}\n';
    }

    location / {
        default_type application/json;
        return 404 '{"code":404,"msg":"route not found"}\n';
    }
}
