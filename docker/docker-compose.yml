services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ai_cloud_storage
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ai-cloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbitmq-password}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  tracker:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/Dockerfile
      target: fastdfs_server
    command: ["tracker"]
    volumes:
      - fastdfs_tracker_data:/data/fastdfs/tracker
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/22122'"]
      interval: 3s
      timeout: 2s
      retries: 20

  storage:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/Dockerfile
      target: fastdfs_server
    command: ["storage"]
    volumes:
      - fastdfs_storage_meta:/data/fastdfs/storage-meta
      - fastdfs_storage_data:/data/fastdfs/storage
    depends_on:
      tracker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "fdfs_monitor /etc/fdfs/client.conf 2>/dev/null | grep -q 'ACTIVE'"]
      interval: 3s
      timeout: 3s
      retries: 30

  fastcgi_app:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/Dockerfile
      target: fastcgi_app
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      MYSQL_DATABASE: ai_cloud_storage
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TOKEN_TTL_SECONDS: 86400
      SHARE_TTL_SECONDS: ${SHARE_TTL_SECONDS:-604800}
      SHARE_CODE_MAX_FAILURES: ${SHARE_CODE_MAX_FAILURES:-5}
      SHARE_CODE_FAILURE_WINDOW_SECONDS: ${SHARE_CODE_FAILURE_WINDOW_SECONDS:-300}
      UPLOAD_MAX_BYTES: 10485760
      UPLOAD_TEMP_DIR: /tmp
      FASTDFS_CLIENT_CONFIG: /etc/fdfs/client.conf
      FASTDFS_PUBLIC_BASE_URL: ${FASTDFS_PUBLIC_BASE_URL:-http://localhost:8080/storage}
      CLEANUP_MAX_RETRIES: ${CLEANUP_MAX_RETRIES:-5}
      CLEANUP_RETRY_BASE_SECONDS: ${CLEANUP_RETRY_BASE_SECONDS:-30}
      CHUNK_UPLOAD_DIR: /data/chunk-uploads
    volumes:
      - chunk_upload_data:/data/chunk-uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  cleanup_worker:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/Dockerfile
      target: fastcgi_app
    command: ["/app/bin_cgi/cleanup_worker", "--watch", "100"]
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      MYSQL_DATABASE: ai_cloud_storage
      FASTDFS_CLIENT_CONFIG: /etc/fdfs/client.conf
      FASTDFS_PUBLIC_BASE_URL: ${FASTDFS_PUBLIC_BASE_URL:-http://localhost:8080/storage}
      CLEANUP_MAX_RETRIES: ${CLEANUP_MAX_RETRIES:-5}
      CLEANUP_RETRY_BASE_SECONDS: ${CLEANUP_RETRY_BASE_SECONDS:-30}
      CLEANUP_POLL_INTERVAL_SECONDS: ${CLEANUP_POLL_INTERVAL_SECONDS:-10}
    depends_on:
      mysql:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/bin_cgi/cleanup_metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  outbox_publisher:
    build:
      context: ..
      dockerfile: docker/fastcgi_app/Dockerfile
      target: fastcgi_app
    command: ["/app/bin_cgi/outbox_publisher", "--watch", "100"]
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      MYSQL_DATABASE: ai_cloud_storage
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ai-cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbitmq-password}
      OUTBOX_MAX_RETRIES: ${OUTBOX_MAX_RETRIES:-8}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-5}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_STALE_SECONDS: ${OUTBOX_STALE_SECONDS:-300}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/bin_cgi/outbox_metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ai_content_worker:
    profiles: ["ai"]
    build:
      context: ..
      dockerfile: docker/fastcgi_app/Dockerfile
      target: fastcgi_app
    command: ["/app/bin_cgi/ai_content_worker"]
    restart: on-failure
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-password}
      MYSQL_DATABASE: ai_cloud_storage
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-ai-cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbitmq-password}
      FASTDFS_CLIENT_CONFIG: /etc/fdfs/client.conf
      FASTDFS_PUBLIC_BASE_URL: ${FASTDFS_PUBLIC_BASE_URL:-http://localhost:8080/storage}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_VISION_MODEL: ${DASHSCOPE_VISION_MODEL:-qwen-vl-plus}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      AI_CONTENT_MAX_RETRIES: ${AI_CONTENT_MAX_RETRIES:-5}
      AI_CONTENT_RETRY_SECONDS: ${AI_CONTENT_RETRY_SECONDS:-15}
      AI_CONTENT_STALE_SECONDS: ${AI_CONTENT_STALE_SECONDS:-300}
      AI_CONTENT_TEMP_DIR: /tmp
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - fastdfs_storage_data:/data/fastdfs/storage:ro
    depends_on:
      - fastcgi_app

volumes:
  mysql_data:
  redis_data:
  fastdfs_tracker_data:
  fastdfs_storage_meta:
  fastdfs_storage_data:
  chunk_upload_data:
  rabbitmq_data:
